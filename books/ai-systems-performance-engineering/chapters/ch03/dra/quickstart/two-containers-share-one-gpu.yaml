# gpu-test2：1 个 Pod、2 个容器，共享同一张 GPU。
#
#   ┌─ Pod ──────────────────┐
#   │  ┌────────┐ ┌────────┐  │
#   │  │  ctr0  │ │  ctr1  │  │
#   │  └───┬────┘ └───┬────┘  │
#   └──────┼──────────┼───────┘
#          └────┬─────┘
#          ┌────┴────┐
#          │  GPU 0  │
#          └─────────┘
#
# 两个容器引用同一个 claim → 映射到同一张物理 GPU。

---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-test2
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: gpu-test2
  name: single-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
---
apiVersion: v1
kind: Pod
metadata:
  namespace: gpu-test2
  name: pod
  labels:
    app: pod
spec:
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["nvidia-smi -L; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: shared-gpu
  - name: ctr1
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["nvidia-smi -L; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: shared-gpu
  resourceClaims:
  - name: shared-gpu
    resourceClaimTemplateName: single-gpu
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
