# H100 节点上 NVIDIA DRA driver（开启 DynamicMIG）实际发布的 ResourceSlice，
#
# 结构：1 个 ResourceSlice = 这张卡的“可切分菜单”
#   node=dra-demo-worker，pool.resourceSliceCount=1（K8s 1.34：counters 与 devices 放同一 slice）
#
#   sharedCounters: gpu-0-counter-set     ← 整张 H100 的资源池（总量）
#       显存切片 8 格 slice0..7（每格总量=1）     multiprocessors(SM): 114
#       copy:8  decoders:7  jpeg:7  ofa:1        memory: 80GB
#
#   devices: 1 个整卡 + 25 个 MIG 摆放（彼此重叠；各自 consumesCounters 从上面的池扣额度）
#       显存切片占用：* = 占用 / . = 空闲（slice0 ──► slice7）
#
#       profile        slice0-7      SM    显存    个数
#       1g.10gb        *.......      14    10GB     7
#       1g.10gb+me     *.......      14    10GB     7
#       1g.20gb        **......      14    20GB     4   ← 1 份算力 + 2 格显存
#       2g.20gb        **......      30    20GB     3
#       3g.40gb        ****....      46    40GB     2
#       4g.40gb        ****....      62    40GB     1
#       7g.80gb        ********     114    80GB     1
#       gpu-0          ********     114    80GB     1   ← 整卡
#       （上表是从 slice0 起的代表；同 profile 其它实例占 slice1、2…，所以 1g 才有 7 个）
#
# 调度（counter 记账，不改这份 slice）：可用 = 池 − Σ(已分配 ResourceClaim 的 consumesCounters)
#   占同一显存格的设备互斥（每格总量只有 1）→ 自动满足 MIG 几何约束。
#   例：分配一个 2g.20gb（占 slice0,1）后 → [x][x][ ][ ][ ][ ][ ][ ]
#       仍要 slice0/1 的（整卡 / 7g / 3g / 4g / 1g…）不可再分；
#       只占 slice2..7 的（如另一个 3g.40gb）可同卡共存。
#   kubelet plugin 在 NodePrepareResources 阶段把选中的 MIG 真正切出来。
